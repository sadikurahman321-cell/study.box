<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDYBOX | Play Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="key-manager.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { themeBg: '#050507', cardBg: '#0a0a0c', cardHover: '#121214', themeYellow: '#FACC15', themeAmber: '#F59E0B', themeGreen: '#10B981', themeRed: '#EF4444', textDim: '#8A8A8A' },
                    fontFamily: { sans: ['Outfit','sans-serif'], mono: ['Space Grotesk','monospace'] }
                }
            }
        }
    </script>
    <style>
        :root { --plyr-color-main: #FACC15; --plyr-video-control-color-hover: #000; --plyr-video-control-background-hover: #FACC15; --plyr-menu-background: #0a0a0c; --plyr-menu-color: #fff; --plyr-tooltip-background: #FACC15; --plyr-tooltip-color: #000; --plyr-menu-radius: 1rem; --plyr-control-radius: 0.5rem; }
        .plyr { border-radius: 1.25rem; width: 100%; height: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); background: #000; }
        .control-btn { background: #111114; color: #8A8A8A; border: 1px solid rgba(255,255,255,0.08); padding: 0.5rem 1.25rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 700; font-family: 'Space Grotesk', monospace; transition: all 0.2s ease; cursor: pointer; }
        .control-btn:hover { background: #1a1a20; color: #fff; border-color: rgba(250, 204, 21, 0.4); }
        .control-btn.active { background: #FACC15; color: #000; border-color: #FACC15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.3); }
    </style>
</head>
<body class="min-h-screen relative flex flex-col font-sans overflow-x-hidden bg-background text-gray-200">
    <div class="fixed inset-0 pointer-events-none bg-yellow-grid z-[-1]"></div>
    <div class="fixed top-[-10%] left-[-5%] w-[400px] h-[400px] bg-themeYellow rounded-full blur-[150px] pointer-events-none z-[-1] orb-1"></div>
    <div class="fixed bottom-[-15%] right-[-5%] w-[500px] h-[500px] bg-themeAmber rounded-full blur-[160px] pointer-events-none z-[-1] orb-2 opacity-50"></div>

    <div id="custom-toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-cardBg border border-themeYellow/30 px-6 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 max-w-md">
            <div id="toast-icon-container" class="w-8 h-8 rounded-xl flex items-center justify-center bg-themeYellow/10 text-themeYellow"><i id="toast-icon" data-lucide="bell" class="w-4 h-4"></i></div>
            <div><p id="toast-msg" class="text-xs font-bold text-white leading-snug"></p></div>
        </div>
    </div>

    <nav class="w-full z-40 bg-[#050507]/85 backdrop-blur-2xl border-b border-white/10 h-[65px] shrink-0 sticky top-0">
        <div class="max-w-[90rem] mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="goBack()" class="p-2 sm:px-3.5 sm:py-2 bg-cardBg border border-white/10 hover:bg-themeYellow hover:text-black rounded-xl transition-all btn-press text-textDim flex items-center gap-2 text-xs font-bold font-mono"><i data-lucide="arrow-left" class="w-4 h-4"></i><span class="hidden sm:block">BACK TO COURSE</span></button>
                <div class="hidden md:flex items-center gap-3 ml-2">
                    <div class="w-8 h-8 rounded-lg bg-themeYellow/20 border border-themeYellow/40 flex items-center justify-center"><i data-lucide="play-circle" class="w-5 h-5 text-themeYellow"></i></div>
                    <h1 class="text-lg font-black tracking-widest text-white font-mono">STUDY<span class="text-themeYellow">BOX</span></h1>
                </div>
            </div>
            <div id="key-status-badge"></div>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 flex flex-col justify-center relative z-10">
        <div id="resolver-overlay" class="flex flex-col items-center justify-center py-24 pop-in">
            <div class="relative w-14 h-14 mb-4">
                <div class="absolute inset-0 rounded-full border-t-4 border-themeYellow animate-spin"></div>
                <div class="absolute inset-2 rounded-full border-r-4 border-themeAmber animate-spin" style="animation-direction: reverse; animation-duration: 0.8s;"></div>
            </div>
            <p id="loader-text" class="text-themeYellow font-mono font-bold uppercase tracking-widest text-xs animate-pulse">Fetching Cloudfront Media Stream...</p>
        </div>

        <div id="fallback-state" class="hidden flex-col items-center justify-center py-16 pop-in text-center">
            <div id="fallback-icon-container" class="w-20 h-20 bg-cardBg border border-themeYellow/30 rounded-3xl flex items-center justify-center mb-6 shadow-2xl relative overflow-hidden"><i id="fallback-icon" data-lucide="file-text" class="w-9 h-9 text-themeYellow relative z-10"></i></div>
            <h2 id="fallback-title" class="text-2xl font-black text-white mb-2 font-mono">PDF Document Ready</h2>
            <p id="fallback-message" class="text-gray-400 text-sm mb-8 max-w-md">Click below to open or download this study notes document.</p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-md">
                <button id="fallback-action-btn" class="w-full sm:w-auto bg-themeYellow text-black font-mono font-bold uppercase tracking-wider px-6 py-3 rounded-xl hover:bg-yellow-400 transition-all btn-press text-xs flex items-center justify-center gap-2"><i data-lucide="external-link" class="w-4 h-4"></i> <span id="fallback-action-text">Open PDF Document</span></button>
                <button onclick="goBack()" class="w-full sm:w-auto bg-cardBg text-gray-300 border border-white/10 font-mono font-bold uppercase tracking-wider px-6 py-3 rounded-xl hover:bg-cardHover transition-all btn-press text-xs flex items-center justify-center gap-2"><i data-lucide="arrow-left" class="w-4 h-4"></i> Go Back</button>
            </div>
        </div>

        <div id="player-container" class="hidden flex-col w-full pop-in">
            <div id="player-wrapper" class="w-full aspect-video relative shadow-2xl border border-white/10 mb-6 rounded-2xl bg-black overflow-hidden">
                <div id="plyr-wrapper" class="w-full h-full absolute inset-0 z-10"><video id="plyr-video" class="w-full h-full" playsinline controls></video></div>
                <div id="yt-player" class="w-full h-full hidden absolute inset-0 z-10"></div>
            </div>
            <div class="glass-card p-6 rounded-2xl flex flex-col relative overflow-hidden border-white/10">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <div class="inline-flex items-center gap-1.5 bg-themeYellow/10 border border-themeYellow/30 px-3 py-1 rounded-md mb-2"><span class="text-[10px] font-mono font-bold text-themeYellow uppercase tracking-widest">STUDYBOX PLAYER</span></div>
                        <h1 id="video-title" class="font-sans text-xl sm:text-2xl font-black text-white leading-tight">Loading Video Title...</h1>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6 border-t border-white/10">
                    <div>
                        <div class="text-xs font-mono font-bold text-textDim mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="settings" class="w-4 h-4 text-themeYellow"></i> Stream Quality</div>
                        <div id="quality-controls" class="flex flex-wrap gap-2"><button onclick="setQuality(-1)" class="control-btn quality-btn active" data-val="-1">Auto</button></div>
                    </div>
                    <div>
                        <div class="text-xs font-mono font-bold text-textDim mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="gauge" class="w-4 h-4 text-themeYellow"></i> Speed</div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="setSpeed(0.5)" data-val="0.5" class="control-btn speed-btn">0.5x</button>
                            <button onclick="setSpeed(1.0)" data-val="1.0" class="control-btn speed-btn active">1.0x</button>
                            <button onclick="setSpeed(1.5)" data-val="1.5" class="control-btn speed-btn">1.5x</button>
                            <button onclick="setSpeed(2.0)" data-val="2.0" class="control-btn speed-btn">2.0x</button>
                        </div>
                    </div>
                    <div>
                        <div class="text-xs font-mono font-bold text-textDim mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="monitor" class="w-4 h-4 text-themeYellow"></i> Mode</div>
                        <button onclick="toggleFullScreen()" class="control-btn w-full flex items-center justify-center gap-2 text-themeYellow border-themeYellow/30 hover:bg-themeYellow hover:text-black"><i data-lucide="maximize" class="w-4 h-4"></i> Full Screen</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const COURSE_ID = urlParams.get('courseId') || urlParams.get('id') || '101';
        const CONTENT_ID = urlParams.get('contentId') || '20779';
        const FILE_URL = decodeURIComponent(urlParams.get('url') || '');
        const FILE_TITLE = decodeURIComponent(urlParams.get('title') || 'StudyBox Premium Lecture');
        const FILE_TYPE = parseInt(urlParams.get('type') || '2');
        const FILE_THUMB = decodeURIComponent(urlParams.get('thumb') || '');
        const FILE_DURATION = urlParams.get('duration') || '';

        window.playerInstance = null;
        window.hlsInstance = null;

        window.goBack = function() { window.location.href = `content.html?id=${COURSE_ID}`; };

        window.showToast = function(message) {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('opacity-0', '-translate-y-24', 'pointer-events-none');
            setTimeout(() => { toast.classList.add('opacity-0', '-translate-y-24', 'pointer-events-none'); }, 3000);
        };

        function showState(stateId) {
            ['resolver-overlay', 'fallback-state', 'player-container'].forEach(id => {
                const el = document.getElementById(id);
                if (id === stateId) { el.classList.remove('hidden'); el.classList.add('flex'); }
                else { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!StudyBoxKey.isKeyValid()) { StudyBoxKey.openKeyModal(); return; }
            initMediaPlayer();
        });

        function initMediaPlayer() {
            const isPdf = FILE_TYPE === 1 || (FILE_URL && FILE_URL.toLowerCase().includes('.pdf'));
            const isYouTube = FILE_URL && (FILE_URL.includes('youtube.com') || FILE_URL.includes('youtu.be'));
            const title = FILE_TITLE || "StudyBox Premium Lecture";

          if (isPdf) {
                showState('fallback-state');
                document.getElementById('fallback-title').innerText = title;
                document.getElementById('fallback-action-btn').onclick = () => window.open(FILE_URL || "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", '_blank');
                return;
            }

            if (isYouTube) {
                initYouTubePlayer(FILE_URL, title);
                return;
            }

            if (FILE_URL) {
                initVideoPlayer(FILE_URL, title, FILE_THUMB);
                return;
            }

            const sampleUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
            initVideoPlayer(sampleUrl, "Lecture 01 : Fundamental Concepts", "");
        }

        function initYouTubePlayer(url, title) {
            showState('player-container');
            document.getElementById('video-title').innerText = title;
            document.getElementById('plyr-wrapper').classList.add('hidden');
            const ytContainer = document.getElementById('yt-player');
            ytContainer.classList.remove('hidden');
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|live\/|shorts\/))([^?&#]+)/);
            const ytId = match ? match[1] : 'dQw4w9WgXcQ';
            ytContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }

        function initVideoPlayer(sourceUrl, title, poster) {
            showState('player-container');
            document.getElementById('video-title').innerText = title;
            document.getElementById('plyr-wrapper').classList.remove('hidden');
            document.getElementById('yt-player').classList.add('hidden');
            const video = document.getElementById('plyr-video');
            if (poster) video.poster = poster;
            if (window.playerInstance) window.playerInstance.destroy();
            if (window.hlsInstance) window.hlsInstance.destroy();
            const defaultOptions = { controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'], autoplay: true };

            if (sourceUrl.includes('.m3u8') && Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 60 });
                hls.loadSource(sourceUrl);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const qualityContainer = document.getElementById('quality-controls');
                    if (qualityContainer) {
                        let html = `<button onclick="setQuality(-1)" class="control-btn quality-btn active" data-val="-1">Auto</button>`;
                        hls.levels.forEach((l, idx) => { html += `<button onclick="setQuality(${idx})" class="control-btn quality-btn" data-val="${idx}">${l.height}p</button>`; });
                        qualityContainer.innerHTML = html;
                    }
                    window.playerInstance = new Plyr(video, defaultOptions);
                });
                hls.attachMedia(video);
                window.hlsInstance = hls;
            } else {
                video.src = sourceUrl;
                window.playerInstance = new Plyr(video, defaultOptions);
            }
        }

        window.setQuality = function(index) {
            if (window.hlsInstance) {
                window.hlsInstance.currentLevel = index;
                document.querySelectorAll('.quality-btn').forEach(btn => { if (parseInt(btn.dataset.val) === index) btn.classList.add('active'); else btn.classList.remove('active'); });
                window.showToast(index === -1 ? 'Quality set to Auto' : `Quality set to level ${index}`);
            }
        };

        window.setSpeed = function(speed) {
            if (window.playerInstance) window.playerInstance.speed = speed;
            const video = document.getElementById('plyr-video');
            if (video) video.playbackRate = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => { if (parseFloat(btn.dataset.val) === speed) btn.classList.add('active'); else btn.classList.remove('active'); });
            window.showToast(`Playback speed set to ${speed}x`);
        };

        window.toggleFullScreen = function() { if (window.playerInstance) window.playerInstance.fullscreen.toggle(); };
    </script>
</body>
</html>
