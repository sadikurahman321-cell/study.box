<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDYBOX - Course Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="key-manager.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: '#050507', cardBg: 'rgba(10, 10, 12, 0.65)', cardHover: 'rgba(18, 18, 22, 0.85)',
                        themeYellow: '#FACC15', themeAmber: '#F59E0B', themeGreen: '#10B981', textDim: '#8A8A8A'
                    },
                    fontFamily: { sans: ['Outfit','Inter','sans-serif'], mono: ['Space Grotesk','monospace'] }
                }
            }
        }
    </script>
</head>
<body class="text-white min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none bg-yellow-grid z-[-1]"></div>
    <div class="fixed top-[-10%] left-[-5%] w-[400px] h-[400px] bg-themeYellow rounded-full blur-[150px] pointer-events-none z-[-1] orb-1"></div>
    <div class="fixed bottom-[-15%] right-[-5%] w-[500px] h-[500px] bg-themeAmber rounded-full blur-[160px] pointer-events-none z-[-1] orb-2 opacity-50"></div>

    <header class="border-b border-white/10 bg-[#050507]/85 backdrop-blur-xl px-4 py-3 sticky top-0 z-50 flex items-center justify-between shadow-2xl">
        <div class="flex items-center gap-4 md:gap-6">
            <button onclick="window.location.href='index.html'" class="flex items-center gap-2 text-textDim hover:text-themeYellow transition-colors text-xs font-bold tracking-wider btn-press">
                <i class="fa-solid fa-arrow-left"></i> <span class="hidden md:inline font-mono">BACK TO BATCHES</span>
            </button>
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="relative w-8 h-8 md:w-9 md:h-9 rounded-xl bg-themeYellow/20 border border-themeYellow/40 flex items-center justify-center shadow-neon">
                    <i class="ph-bold ph-cube text-xl text-themeYellow"></i>
                </div>
                <h1 class="text-lg md:text-xl font-black tracking-widest text-white font-mono">STUDY<span class="text-themeYellow">BOX</span></h1>
            </div>
        </div>
        <div id="key-status-badge"></div>
    </header>

    <main class="max-w-[1400px] w-full mx-auto p-4 md:p-6 lg:p-8 flex-1 relative z-10">
        <div id="course-banner" class="glass-card rounded-3xl p-6 md:p-10 flex flex-col-reverse md:flex-row items-center justify-between gap-8 mb-8 shadow-2xl relative overflow-hidden pop-in border-themeYellow/20">
            <div class="absolute -top-24 -left-24 w-64 h-64 bg-themeYellow/10 blur-[100px] rounded-full pointer-events-none"></div>
            <div class="flex flex-col items-start gap-4 flex-1 w-full relative z-10">
                <div class="flex items-center gap-2 px-3 py-1 bg-themeYellow/10 border border-themeYellow/30 rounded-full text-xs font-bold text-themeYellow uppercase tracking-wider shadow-inner font-mono">
                    <div class="w-1.5 h-1.5 rounded-full bg-themeYellow animate-pulse"></div>
                    PREMIUM ENROLLED BATCH
                </div>
                <h2 id="course-title" class="text-2xl md:text-4xl lg:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-100 to-gray-400 leading-tight tracking-wide font-sans">Loading Batch Details...</h2>
            </div>
            <div class="w-full md:w-auto shrink-0 flex justify-center md:justify-end relative z-10 group">
                <div class="absolute inset-0 bg-themeYellow/20 blur-2xl rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <img id="course-thumb" src="" alt="Course Thumbnail" class="w-full max-w-[320px] rounded-2xl border border-white/10 shadow-[0_0_30px_rgba(250,204,21,0.15)] object-cover aspect-[16/9] hidden group-hover:scale-105 transition-transform duration-500">
            </div>
        </div>

        <div class="flex gap-4 sm:gap-6 md:gap-8 border-b border-white/10 mb-8 overflow-x-auto no-scrollbar pop-in w-full">
            <button id="tab-overview" onclick="switchTab('overview')" class="pb-3 text-xs sm:text-sm md:text-base font-bold flex items-center gap-2 text-themeYellow border-b-2 border-themeYellow transition-colors whitespace-nowrap btn-press shrink-0 font-mono"><i class="fa-solid fa-circle-info"></i> OVERVIEW</button>
            <button id="tab-content" onclick="switchTab('content')" class="pb-3 text-xs sm:text-sm md:text-base font-bold flex items-center gap-2 text-textDim hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap btn-press shrink-0 font-mono"><i class="fa-regular fa-folder-open"></i> CONTENT</button>
            <button id="tab-live" onclick="switchTab('live')" class="pb-3 text-xs sm:text-sm md:text-base font-bold flex items-center gap-2 text-textDim hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap btn-press shrink-0 font-mono"><i class="fa-solid fa-tower-broadcast"></i> LIVE LECTURES</button>
        </div>

        <div id="loader" class="flex flex-col justify-center items-center py-24 hidden">
            <div class="relative w-14 h-14 mb-4">
                <div class="absolute inset-0 rounded-full border-t-4 border-themeYellow animate-spin"></div>
                <div class="absolute inset-2 rounded-full border-r-4 border-themeAmber animate-spin" style="animation-direction: reverse; animation-duration: 0.8s;"></div>
            </div>
            <p class="text-themeYellow text-xs font-bold tracking-widest uppercase animate-pulse font-mono">Fetching Live Lectures & Subjects...</p>
        </div>

        <div id="section-overview" class="hidden">
            <div class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl text-gray-300 leading-relaxed text-sm md:text-base prose prose-invert max-w-none border-t border-t-themeYellow/20" id="course-desc-content">Loading description...</div>
        </div>

        <div id="section-content" class="hidden">
            <div class="mb-6 glass-card p-3.5 rounded-2xl flex items-center overflow-x-auto whitespace-nowrap no-scrollbar shadow-lg border border-white/5">
                <div id="breadcrumbs" class="flex items-center text-xs md:text-sm font-bold text-textDim uppercase tracking-wider px-2 font-mono"></div>
            </div>
            <div id="content-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 md:gap-6"></div>
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-20 h-20 bg-black/40 rounded-3xl flex items-center justify-center mb-4 border border-white/10 shadow-[0_0_30px_rgba(250,204,21,0.05)] relative overflow-hidden">
                    <i class="fa-regular fa-folder-open text-3xl text-gray-500"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-1 font-mono">Folder is Empty</h3>
                <p class="text-sm text-textDim">No content uploaded to this directory yet.</p>
            </div>
        </div>

        <div id="section-live" class="hidden">
            <div class="glass-card rounded-3xl p-8 text-center border-t border-t-red-500/30">
                <div class="w-16 h-16 bg-red-500/10 rounded-2xl border border-red-500/30 flex items-center justify-center mx-auto mb-4 text-red-500">
                    <i class="fa-solid fa-tower-broadcast text-2xl animate-pulse"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2 font-mono">Live Lecture Streams</h3>
                <p class="text-gray-400 text-sm max-w-md mx-auto">Live classes scheduled for this batch will stream automatically inside the StudyBox player.</p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'https://studybeepro.site/api/nig';
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id') || '101';
        let folderHistory = [{ id: "0", title: "ROOT DIRECTORY" }];
        let mockContents = {};

        const elCourseThumb = document.getElementById('course-thumb');
        const elCourseTitle = document.getElementById('course-title');
        const elCourseDescContent = document.getElementById('course-desc-content');
        const elBreadcrumbs = document.getElementById('breadcrumbs');
        const elLoader = document.getElementById('loader');
        const elContentGrid = document.getElementById('content-grid');
        const elEmptyState = document.getElementById('empty-state');
        const sectionOverview = document.getElementById('section-overview');
        const sectionContent = document.getElementById('section-content');
        const sectionLive = document.getElementById('section-live');

        async function init() {
            try { const res = await fetch('contents.json'); mockContents = await res.json(); } catch(e){}
            switchTab('overview');
            fetchCourseOverview();
            loadFolder("0", "ROOT DIRECTORY");
        }

        window.handlePlayClick = function(event, entityId, fileUrl, title, fileType, thumbnail, duration) {
            event.preventDefault();
            if (!StudyBoxKey.isKeyValid()) { StudyBoxKey.openKeyModal(); return; }
            const params = new URLSearchParams({
                courseId: courseId, contentId: entityId, url: fileUrl || '',
                title: title || '', type: fileType || '', thumb: thumbnail || '', duration: duration || ''
            });
            window.location.href = `play.html?${params.toString()}`;
        };

        function switchTab(tabName) {
            const inactiveClass = "pb-3 text-xs sm:text-sm md:text-base font-bold flex items-center gap-2 text-textDim hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap btn-press shrink-0 font-mono";
            const activeClass = "pb-3 text-xs sm:text-sm md:text-base font-bold flex items-center gap-2 text-themeYellow border-b-2 border-themeYellow transition-colors whitespace-nowrap btn-press shrink-0 font-mono";
            document.getElementById('tab-overview').className = inactiveClass;
            document.getElementById('tab-content').className = inactiveClass;
            document.getElementById('tab-live').className = inactiveClass;
            sectionOverview.classList.add('hidden');
            sectionContent.classList.add('hidden');
            sectionLive.classList.add('hidden');
            if (tabName === 'overview') { document.getElementById('tab-overview').className = activeClass; sectionOverview.classList.remove('hidden'); }
            else if (tabName === 'content') { document.getElementById('tab-content').className = activeClass; sectionContent.classList.remove('hidden'); }
            else if (tabName === 'live') { document.getElementById('tab-live').className = activeClass; sectionLive.classList.remove('hidden'); }
        }

        async function fetchCourseOverview() {
            try {
                const res = await fetch(`${API_BASE_URL}?overview=${courseId}`);
                const json = await res.json();
                if (json.success && json.data) {
                    const overviewTab = json.data.find(d => d.type === 'overview');
                    const detailsSection = overviewTab?.data?.find(l => l.layout_type === 'details');
                    const courseDetails = detailsSection?.layout_data?.[0];
                    if (courseDetails) {
                        elCourseTitle.innerText = courseDetails.title || `Batch #${courseId}`;
                        if (courseDetails.thumbnail) { elCourseThumb.src = courseDetails.thumbnail; elCourseThumb.classList.remove('hidden'); }
                        elCourseDescContent.innerHTML = courseDetails.description || "<p>Complete live and recorded classes with notes & problem solving sessions.</p>";
                        return;
                    }
                }
            } catch (error) {}
            const localData = mockContents[courseId] || { title: `Batch #${courseId}`, thumbnail: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80", description: "<h3>STUDYBOX Premium Course</h3><p>Live classes, video lectures, and notes available.</p>" };
            elCourseTitle.innerText = localData.title;
            if (localData.thumbnail) { elCourseThumb.src = localData.thumbnail; elCourseThumb.classList.remove('hidden'); }
            elCourseDescContent.innerHTML = localData.description;
        }

        async function loadFolder(folderId, folderTitle) {
            const existingIndex = folderHistory.findIndex(f => f.id === folderId);
            if (existingIndex > -1) folderHistory = folderHistory.slice(0, existingIndex + 1);
            else folderHistory.push({ id: folderId, title: folderTitle });
            renderBreadcrumbs();
            showUI('loader');
            try {
                const res = await fetch(`${API_BASE_URL}?content=${courseId}&folder=${folderId}`);
                const json = await res.json();
                if (json.success && json.data && json.data.length > 0) { renderContentGrid(json.data); showUI('grid'); return; }
            } catch (error) {}
            const courseFolders = (mockContents[courseId] && mockContents[courseId].folders) ? mockContents[courseId].folders : {};
            const items = courseFolders[folderId] || getFallbackItemsForFolder(folderId);
            if (items && items.length > 0) { renderContentGrid(items); showUI('grid'); }
            else showUI('empty');
        }
function getRealUrl(itemData) {
    if (itemData.file_url && itemData.file_url.length > 5) return itemData.file_url;
    if (itemData.download_urls) {
        try {
            const urls = JSON.parse(itemData.download_urls);
            if (Array.isArray(urls) && urls.length > 0) return urls[urls.length - 1].url;
        } catch(e) {}
    }
    return '';
}

        function getFallbackItemsForFolder(folderId) {
            if (folderId === "0") return [
                { type: "folder", entity_id: "subject-1", title: "01. Accountancy / Physics", data: { content_counts: { folders: { total: 4 }, video: { paid: 12 }, pdf: { paid: 12 } } } },
                { type: "folder", entity_id: "subject-2", title: "02. Economics / Chemistry", data: { content_counts: { folders: { total: 3 }, video: { paid: 10 }, pdf: { paid: 10 } } } }
            ];
            return [
                { type: "file", entity_id: "v101", title: "Lecture 01 : Fundamental Concepts & Principles", data: { file_type: 2, video_type: 1, duration: 4320, created_at: 1722700000, file_url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" } },
                { type: "file", entity_id: "pdf101", title: "Lecture 01 : Class Notes & Practice PDF", data: { file_type: 1, created_at: 1722700500, file_url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" } }
            ];
        }

        function renderBreadcrumbs() {
            elBreadcrumbs.innerHTML = folderHistory.map((folder, index) => {
                const isFirst = index === 0, isLast = index === folderHistory.length - 1;
                let icon = isFirst ? `<i class="fa-solid fa-hard-drive mr-2 ${isLast ? 'text-themeYellow' : ''}"></i>` : '';
                let colorClass = isLast ? 'text-themeYellow font-bold' : 'text-textDim hover:text-white cursor-pointer';
                return `<span class="flex items-center group"><span class="flex items-center transition-colors ${colorClass} btn-press" onclick="${isLast ? '' : `loadFolder('${folder.id}', '${folder.title.replace(/'/g, "\\\\'")}')`}">${icon} ${folder.title}</span>${!isLast ? `<i class="fa-solid fa-chevron-right text-[9px] mx-3 text-gray-600"></i>` : ''}</span>`;
            }).join('');
        }

        function renderContentGrid(items) {
            elContentGrid.innerHTML = items.map((item, index) => {
                if (item.type === 'folder') return generateFolderHTML(item, index);
                if (item.type === 'file') {
                    const fileType = item.data?.file_type;
                    if (fileType === 2 || item.data?.video_type > 0 || item.data?.vdc_id) return generateVideoHTML(item, index);
                    return generatePdfHTML(item, index);
                }
                return '';
            }).join('');
        }

        function generateFolderHTML(item, index) {
            const counts = item.data?.content_counts || {};
            const fCount = counts.folders?.total || 0;
            const vCount = (counts.video?.paid || 0) + (counts.video?.free || 0);
            const pCount = (counts.pdf?.paid || 0) + (counts.pdf?.free || 0);
            const escapedTitle = item.title.replace(/'/g, "\\\\'");
            let countsText = `VIDEOS ${vCount} &nbsp;•&nbsp; PDFS ${pCount}`;
            if (fCount > 0 && vCount === 0 && pCount === 0) countsText = `SUBFOLDERS ${fCount}`;
            const thumbnailHTML = item.data?.thumbnail ? `<img src="${item.data.thumbnail}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">` : `<div class="w-full h-full flex items-center justify-center bg-[#0a0a0c] relative overflow-hidden"><div class="w-14 h-14 rounded-2xl bg-zinc-900 border border-white/10 flex items-center justify-center shadow-2xl z-10 group-hover:scale-110 transition-all duration-300"><i class="fa-solid fa-folder text-3xl text-themeYellow"></i></div></div>`;
            return `<div onclick="loadFolder('${item.entity_id}', '${escapedTitle}')" class="glass-card rounded-2xl cursor-pointer hover:-translate-y-2 hover:shadow-2xl hover:border-themeYellow/40 group flex flex-col overflow-hidden h-[210px] pop-in btn-press"><div class="h-[120px] w-full relative overflow-hidden bg-black/80 border-b border-white/5">${thumbnailHTML}</div><div class="p-4 flex-1 flex flex-col justify-between bg-cardBg group-hover:bg-cardHover transition-colors"><h3 class="text-white font-bold text-sm leading-snug line-clamp-2 group-hover:text-themeYellow transition-colors">${item.title}</h3><div class="text-[10px] text-textDim font-mono font-bold uppercase tracking-wider">${countsText}</div></div></div>`;
        }

        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return '45:00';
            const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = Math.floor(seconds % 60);
            const mStr = m.toString().padStart(2, '0'), sStr = s.toString().padStart(2, '0');
            return h > 0 ? `${h}:${mStr}:${sStr}` : `${mStr}:${sStr}`;
        }

        function generateVideoHTML(item, index) {
            const thumbnail = (item.data?.thumbnail && item.data.thumbnail.trim() !== "") ? item.data.thumbnail : 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80';
            const duration = formatDuration(item.data?.duration);
            const fileUrl = getRealUrl(item.data);
            const title = item.title || '';
            const fileType = item.data?.file_type || 2;
            const entityId = item.entity_id || '';
            const dur = item.data?.duration || '';
            return `<div onclick="handlePlayClick(event, '${entityId}', '${encodeURIComponent(fileUrl)}', '${encodeURIComponent(title)}', '${fileType}', '${encodeURIComponent(thumbnail)}', '${dur}')" class="glass-card rounded-2xl overflow-hidden cursor-pointer hover:-translate-y-2 hover:border-themeYellow/40 group flex flex-col h-[210px] pop-in btn-press"><div class="relative h-[120px] w-full bg-black overflow-hidden border-b border-white/5"><img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500"><div class="absolute top-2 left-2 flex items-center gap-1 px-2 py-0.5 bg-black/80 backdrop-blur-md rounded border border-white/10 text-[8px] font-mono font-bold text-themeYellow uppercase tracking-widest"><i class="fa-solid fa-video text-[10px]"></i> LECTURE</div><div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/30"><div class="w-11 h-11 bg-themeYellow rounded-full flex items-center justify-center pl-0.5 shadow-lg transform scale-75 group-hover:scale-100 transition-transform"><i class="fa-solid fa-play text-black text-base"></i></div></div>${duration !== '00:00' ? `<div class="absolute bottom-2 right-2 bg-black/80 text-white text-[9px] px-1.5 py-0.5 rounded font-mono font-bold border border-white/10">${duration}</div>` : ''}</div><div class="p-4 flex-1 flex flex-col justify-between bg-cardBg group-hover:bg-cardHover transition-colors"><h3 class="text-white font-bold text-sm leading-snug line-clamp-2 group-hover:text-themeYellow transition-colors">${title}</h3><div class="text-[9px] text-textDim font-mono font-bold tracking-widest uppercase">Click to Play Video</div></div></div>`;
        }

        function generatePdfHTML(item, index) {
            const fileUrl = item.data?.file_url || '', title = item.title || '', fileType = item.data?.file_type || 1, entityId = item.entity_id || '';
            return `<div onclick="handlePlayClick(event, '${entityId}', '${encodeURIComponent(fileUrl)}', '${encodeURIComponent(title)}', '${fileType}', '', '')" class="glass-card rounded-2xl overflow-hidden cursor-pointer hover:-translate-y-2 hover:border-red-500/40 group flex flex-col h-[210px] pop-in btn-press"><div class="relative h-[120px] w-full bg-[#0a0a0c] flex items-center justify-center overflow-hidden border-b border-white/5"><div class="w-14 h-14 rounded-2xl bg-zinc-900 border border-white/10 flex items-center justify-center shadow-2xl z-10 group-hover:scale-110 transition-all duration-300"><i class="fa-solid fa-file-pdf text-3xl text-red-500"></i></div><div class="absolute top-2 left-2 flex items-center gap-1.5 px-2 py-0.5 bg-black/80 backdrop-blur-md rounded border border-white/10 text-[8px] font-mono font-bold text-red-400 uppercase tracking-widest">STUDY NOTES</div></div><div class="p-4 flex-1 flex flex-col justify-between bg-cardBg group-hover:bg-cardHover transition-colors"><h3 class="text-white font-bold text-sm leading-snug line-clamp-2 group-hover:text-red-400 transition-colors">${title}</h3><div class="text-[9px] text-textDim font-mono font-bold tracking-widest uppercase">Click to View PDF</div></div></div>`;
        }

        function showUI(state) {
            elLoader.classList.add('hidden'); elContentGrid.classList.add('hidden'); elEmptyState.classList.add('hidden');
            if (state === 'loader') elLoader.classList.remove('hidden');
            else if (state === 'grid') elContentGrid.classList.remove('hidden');
            else if (state === 'empty') elEmptyState.classList.remove('hidden');
        }
        init();
    </script>
</body>
</html>
